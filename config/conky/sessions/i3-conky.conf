# The i3 half of the conky panel. config/i3/config in this repository already contains
# these two lines, so this file is only for a machine whose ~/.config/i3/config is its
# own: setup-conky.sh offers it when it cannot find the autostart there, and says nothing
# when it can. An installer that appended to that file would duplicate the lines on its
# second run, and replacing it would discard your edits -- which is why they are pasted.
# Put them next to the nm-applet and blueman-applet autostarts.
exec --no-startup-id sh ~/.config/conky/start.sh
# Alt+Shift+T: pick a theme, or Off.
bindsym $mod+Shift+t exec --no-startup-id sh ~/.config/conky/switch.sh
