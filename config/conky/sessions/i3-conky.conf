# The i3 half of the conky panel. i3's configuration in this repository is one file that
# install.sh replaces whole, so these two lines are added to ~/.config/i3/config by hand
# rather than written for you: an installer that appended to that file would duplicate
# the lines on its second run, and replacing the file would discard your own edits.
# Paste them next to the nm-applet and blueman-applet autostarts.
exec --no-startup-id sh ~/.config/conky/start.sh
# Alt+Shift+T: pick a theme, or Off.
bindsym $mod+Shift+t exec --no-startup-id sh ~/.config/conky/switch.sh
