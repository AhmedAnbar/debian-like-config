# Conky system panel. setup-conky.sh installs this as
# ~/.config/sway/config.d/30-conky.conf, which ~/.config/sway/config includes, so the
# panel arrives with conky instead of being autostarted by a session that may not have it.
# start.sh exits silently when conky is not installed, and the panel draws with Conky's
# own text, bars and graphs only, so the same configuration serves Wayland and X11.
exec sh ~/.config/conky/start.sh
# Alt+Shift+T: pick a theme, or Off. $mod is set by the main configuration above.
bindsym $mod+Shift+t exec sh ~/.config/conky/switch.sh
