-- Catppuccin Mocha, matching the Sway/i3 borders and the default Rofi theme.
local config_home = os.getenv('XDG_CONFIG_HOME')
if not config_home or config_home == '' then config_home = os.getenv('HOME') .. '/.config' end
dofile(config_home .. '/conky/panel.lua')({
    bg = '1e1e2e',
    surface = '313244',
    muted = 'a6adc8',
    text = 'cdd6f4',
    accent = 'b4befe',
    alert = 'f38ba8',
})
