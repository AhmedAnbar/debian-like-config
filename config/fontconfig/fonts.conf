<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!-- Arabic fallback. Noto Sans/Serif/Mono carry no Arabic glyphs, so without this file
     Chrome falls back to Noto Kufi Arabic, whose wide geometric letterforms look
     disconnected in body text (Firefox happens to pick a Naskh face and looks fine).
     The Latin face stays first in every generic, so Latin rendering is unchanged; the
     Arabic text face follows it and wins for Arabic glyphs. Restart Chrome to apply. -->
<fontconfig>
  <alias binding="strong">
    <family>sans-serif</family>
    <prefer><family>Noto Sans</family><family>Noto Sans Arabic</family></prefer>
  </alias>
  <alias binding="strong">
    <family>system-ui</family>
    <prefer><family>Noto Sans</family><family>Noto Sans Arabic</family></prefer>
  </alias>
  <alias binding="strong">
    <family>serif</family>
    <prefer><family>Noto Serif</family><family>Noto Naskh Arabic</family></prefer>
  </alias>
  <alias binding="strong">
    <family>monospace</family>
    <prefer><family>Noto Sans Mono</family><family>Noto Sans Arabic</family></prefer>
  </alias>
</fontconfig>
